

<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Vintage Library</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header>
        <div class="logo">
            The Vintage Library
        </div>
    </header>


    <main class="container">

        <h1 class="page-title">
            Discover Classic Books
        </h1>


        <div class="books">

            {% for book in books %}

                <div class="book-card">

                    <img
                        class="book-cover"
                        src="{{ book.cover.url }}"
                        alt="{{ book.title }}"
                    >

                    <h2 class="book-title">
                        {{ book.title }}
                    </h2>

                    <p class="author">
                        {{ book.author }}
                    </p>

                    <a
                        href="{{ book.file.url }}"
                        class="download-btn"
                        download
                    >
                        Download Book
                    </a>

                </div>

            {% empty %}

                <p>No books available yet.</p>

            {% endfor %}

        </div>

    </main>


    <footer>
        <p>© 2026 The Vintage Library</p>
    </footer>

</body>

</html>
